syntax = "proto3";

package spine.core;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.core";
option java_multiple_files = true;
option java_outer_classname = "ResponseProto";

import "google/protobuf/empty.proto";

import "spine/base/error.proto";
import "spine/core/error_case.proto";
import "spine/core/event.proto";

// The result of a call returned by a service.
//
// A service may return `ok` or an `error_case` (the request cannot be accepted). The client may
// expect results (returned via a separate call to the read-side or via event stream) only upon
// receiving the `ok` status.
//
message Response {
    option (is).java_type = "ResponseMixin";

    // The response status.
    Status status = 1 [(required) = true];
}

// The response status.
message Status {
    oneof status {
        option (choice).required = true;

        // The request was accepted to execution.
        google.protobuf.Empty ok = 1;

        // The technical error occurred upon receiving the request, and no further
        // processing would occur.
        //
        // Deprecated: the server reports errors with `error_case`.
        //
        // The server does not send this field to clients. It is going to be removed.
        //
        base.Error error = 2 [deprecated = true];

        // It is not possible to satisfy the request because of the business rejection.
        //
        // Deprecated: a command is rejected only by its handler, after the command is
        // acknowledged. The client receives such a rejection as an event, through
        // a subscription.
        //
        // The server does not send this field to clients. It is going to be removed.
        //
        core.Event rejection = 3 [deprecated = true];

        // The request cannot be accepted, and no further processing would occur.
        //
        // The value tells only the kind of the problem. The server keeps the details
        // in a diagnostic event of the System context.
        //
        ErrorCase error_case = 4;
    }
}
