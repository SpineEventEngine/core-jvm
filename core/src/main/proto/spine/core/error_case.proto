syntax = "proto3";

package spine.core;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.core";
option java_multiple_files = true;
option java_outer_classname = "ErrorCaseProto";

// The kind of problem that stopped a request.
//
// The server tells the client only the kind of the problem, not why it happened. This makes
// repeated attempts to guess a request that the server would accept less informative.
//
// The server records the details in a diagnostic event of the System context. The event refers
// to the request by its ID, which the client knows, so a developer can find the details
// in the server log.
//
// The values do not name the kind of the request, because the client knows what it sent.
//
enum ErrorCase {

    // Reserved value.
    ERROR_CASE_UNSPECIFIED = 0;

    // The request, its ID, or its context fails validation.
    INVALID_REQUEST = 1;

    // The type of the request is not served.
    //
    // No Bounded Context or handler serves the type, or the type is internal to the server.
    //
    UNSUPPORTED_REQUEST = 2;

    // The tenant of the request is not accepted.
    //
    // The tenant is missing in a multitenant application, given to a single-tenant one,
    // or not registered.
    //
    TENANT_ERROR = 3;

    // A filter of the application refused the request.
    REQUEST_DENIED = 4;

    // The subscription to activate or cancel is not known to the server.
    //
    // The client may subscribe to the topic again.
    //
    UNKNOWN_SUBSCRIPTION = 5;

    // An unexpected failure occurred on the server side.
    INTERNAL_ERROR = 6;
}
