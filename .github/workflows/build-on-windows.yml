name: Windows CI

# Triggers:
#   * push to a default or release-line branch — the same set as in
#     `build-on-ubuntu.yml`. On the default branch, these post-merge runs seed
#     the Gradle User Home cache that the pull request runs restore:
#     `setup-gradle` saves entries only on the default branch, and a pull
#     request run restores those of its base or the default branch. With
#     `pull_request` as the only trigger, no Windows entry was ever saved, so
#     every run downloaded the Gradle distribution, the `buildSrc` classpath,
#     and all the dependencies from scratch — minutes on each run, and Maven
#     Central faced cold every time. On a release-line branch the run saves
#     nothing, but still checks the merge result on Windows.
#   * pull_request — gates a change on its merge result, not the branch tip.
on:
  push:
    branches:
      - '**master'
      - '**main'
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    name: Build on Windows

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6

      # See: https://github.com/al-cheb/configure-pagefile-action
      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3

      - name: Build project and run tests
        shell: cmd
        run: gradlew.bat build --stacktrace

      # See: https://github.com/marketplace/actions/junit-report-action
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4.0.3
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          require_tests: true
