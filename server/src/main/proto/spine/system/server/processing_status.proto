syntax = "proto3";

package spine.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (internal_all) = true;

option java_package = "io.spine.system.server";
option java_outer_classname = "ProcessingStatusProto";
option java_multiple_files = true;

import "google/protobuf/empty.proto";

import "spine/base/error.proto";
import "spine/core/event.proto";
import "spine/core/tenant_id.proto";
import "spine/validation/validation_error.proto";

// The status of a command after it was processed.
//
// The field numbers match those of `spine.core.Status`, so the stored records of
// `CommandTimeline.how_processed`, which used to be a `spine.core.Status`, stay readable.
//
message ProcessingStatus {

    oneof status {
        option (choice).required = true;

        // The command was handled.
        google.protobuf.Empty ok = 1;

        // The command was accepted, and its handler failed.
        spine.base.Error error = 2;

        // A handler rejected the command.
        spine.core.Event rejection = 3;

        // The `CommandBus` did not accept the command because the command fails validation.
        spine.validation.ValidationError validation_error = 4;

        // The `CommandBus` did not accept the command because no handler in the Bounded
        // Context handles commands of its type.
        google.protobuf.Empty unsupported = 5;

        // The multitenant `CommandBus` did not accept the command because the command has
        // no tenant.
        google.protobuf.Empty tenant_not_specified = 6;

        // The tenant of the command, which the single-tenant `CommandBus` did not accept.
        spine.core.TenantId tenant_not_expected = 7;

        // The `CommandService` failed to post the command because of an unexpected error.
        spine.base.Error posting_error = 8;
    }
}
