syntax = "proto3";

package spine.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (every_is).java_type = "DiagnosticEvent";
option java_package = "io.spine.system.server";
option java_outer_classname = "RequestDiagnosticEventsProto";
option java_multiple_files = true;

import "spine/base/error.proto";
import "spine/core/actor_context.proto";
import "spine/core/diagnostics.proto";
import "spine/validation/validation_error.proto";

// An event emitted when a request fails validation.
//
// The client receives `spine.core.ErrorCase.INVALID_REQUEST`, and this event keeps the details.
//
message RequestValidationFailed {

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;

    // The violated validation constraints.
    repeated validation.ConstraintViolation violation = 3;

    // The error reported on the server side.
    //
    // When the error has the violations in its details, they are moved to `violation`, and
    // the error keeps neither the details nor the message, which repeats them.
    //
    base.Error error = 4;
}

// An event emitted when the server receives a request of a type it does not serve.
//
// The client receives `spine.core.ErrorCase.UNSUPPORTED_REQUEST`, and this event keeps
// the details.
//
message UnsupportedRequestReceived {

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;

    // Why the type of the request is not served.
    Reason reason = 3;

    // The reasons for not serving a type of request.
    enum Reason {

        // Reserved value.
        REASON_UNSPECIFIED = 0;

        // No Bounded Context serves the type.
        NO_CONTEXT = 1;

        // The Bounded Context has no handler, subscriber, or read model for the type.
        NO_RECEIVER = 2;

        // The type is internal to the server and is not a part of the published language.
        INTERNAL_TYPE = 3;
    }
}

// An event emitted when the tenant of a request is not accepted.
//
// The client receives `spine.core.ErrorCase.TENANT_ERROR`, and this event keeps the details.
//
message TenantCheckFailed {

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;

    // Why the tenant is not accepted.
    Reason reason = 3;

    // The reasons for not accepting the tenant of a request.
    enum Reason {

        // Reserved value.
        REASON_UNSPECIFIED = 0;

        // The request has no tenant, but the Bounded Context is multitenant.
        TENANT_NOT_SPECIFIED = 1;

        // The request has a tenant, but the Bounded Context is single-tenant.
        TENANT_INAPPLICABLE = 2;

        // The tenant is not registered in the application.
        TENANT_NOT_REGISTERED = 3;
    }
}

// An event emitted when a filter of the application refuses a request.
//
// The client receives `spine.core.ErrorCase.REQUEST_DENIED`, and this event keeps the details.
//
message RequestDenied {

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;

    // The error given by the filter.
    base.Error error = 3;

    // The name of the class of the filter.
    string filter = 4;
}

// An event emitted when a client asks to activate or cancel a subscription unknown to the server.
//
// The client receives `spine.core.ErrorCase.UNKNOWN_SUBSCRIPTION`.
//
message UnknownSubscriptionRequested {

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;
}

// An event emitted when an unexpected failure occurs while the server serves a request.
//
// The client receives `spine.core.ErrorCase.INTERNAL_ERROR`, and this event keeps the details.
//
message RequestProcessingFailed {

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;

    // The error, with the stack trace.
    base.Error error = 3;
}
