syntax = "proto3";

package spine.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.system.server";
option java_outer_classname = "TenantCheckFailedProto";
option java_multiple_files = true;

import "spine/core/actor_context.proto";
import "spine/core/diagnostics.proto";

// An event emitted when the tenant of a request is not accepted.
//
// The client receives `spine.core.ErrorCase.TENANT_ERROR`, and this event keeps the details.
//
message TenantCheckFailed {
    option (is).java_type = "DiagnosticEvent";

    // The request.
    //
    // The ID is the ID of the request, such as a `CommandId` or a `QueryId`. The type URL is
    // the type of the request message, such as the command message or the target of a query.
    //
    core.MessageId request = 1;

    // The actor and the tenant of the request, as given by the client.
    core.ActorContext actor_context = 2;

    // Why the tenant is not accepted.
    Reason reason = 3;

    // The reasons for not accepting the tenant of a request.
    enum Reason {

        // Reserved value.
        REASON_UNSPECIFIED = 0;

        // The request has no tenant, but the Bounded Context is multitenant.
        TENANT_NOT_SPECIFIED = 1;

        // The request has a tenant, but the Bounded Context is single-tenant.
        TENANT_INAPPLICABLE = 2;

        // The tenant is not registered in the application.
        TENANT_NOT_REGISTERED = 3;
    }
}
