syntax = "proto3";

package spine.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (internal_all) = true;

option java_package = "io.spine.system.server.event";
option java_outer_classname = "CommandLifecycleEventsProto";
option java_multiple_files = true;

import "spine/base/error.proto";
import "spine/core/command.proto";
import "spine/core/event.proto";
import "spine/core/tenant_id.proto";
import "spine/system/server/command_log.proto";
import "spine/validation/validation_error.proto";

// An event emitted when a new command is received by the `CommandBus`.
message CommandReceived {

    // The ID of the command.
    core.CommandId id = 1;

    // The command.
    core.Command payload = 2 [(required) = true];
}

// An event emitted when the command is acknowledged by the `CommandBus`.
message CommandAcknowledged {

    // The ID of the command.
    core.CommandId id = 1;
}

// An event emitted when the command is scheduled.
message CommandScheduled {

    // The ID of the command.
    core.CommandId id = 1;

    // The schedule to execute the command.
    core.CommandContext.Schedule schedule = 2 [(validate) = true];
}

// An event emitted when a command is passed to a dispatcher after being acknowledged.
message CommandDispatched {

    // The ID of the command.
    core.CommandId id = 1;
}

// An event emitted when the command target is determined.
//
// This event is emitted before the command is delivered to the target.
//
message TargetAssignedToCommand {

    // The ID of the command.
    core.CommandId id = 1;

    // The target of the command.
    CommandTarget target = 2 [(validate) = true];
}

// An event emitted when a command is successfully handled.
message CommandHandled {

    // The ID of the command.
    core.CommandId id = 1;
}

// An event emitted when the `CommandBus` does not accept a command because the command
// fails validation.
message CommandValidationFailed {

    // The ID of the command.
    //
    // The field is not required: the command may be refused because it has no ID.
    //
    core.CommandId id = 1;

    // The constraints that the command violates.
    validation.ValidationError validation_error = 2 [(required) = true];
}

// An event emitted when the `CommandBus` does not accept a command because no handler
// in the Bounded Context handles commands of its type.
message UnsupportedCommandReceived {

    // The ID of the command.
    core.CommandId id = 1 [(required) = true];

    // The type URL of the command message.
    string type_url = 2 [(required) = true];
}

// An event emitted when a multitenant `CommandBus` does not accept a command because
// the command has no tenant.
message CommandTenantNotSpecified {

    // The ID of the command.
    //
    // The field is not required: the tenant is checked before the command is validated,
    // so the command may have no ID.
    //
    core.CommandId id = 1;
}

// An event emitted when a single-tenant `CommandBus` does not accept a command because
// the command has a tenant.
message CommandTenantNotExpected {

    // The ID of the command.
    //
    // The field is not required: the tenant is checked before the command is validated,
    // so the command may have no ID.
    //
    core.CommandId id = 1;

    // The tenant of the command.
    core.TenantId tenant = 2 [(required) = true];
}

// An event emitted when the `CommandService` fails to post a command because of an unexpected
// error on the server side.
message CommandPostingFailed {

    // The ID of the command.
    core.CommandId id = 1;

    // The error that stopped the posting.
    base.Error error = 2;
}

// An event emitted if the command cannot be handled due to a business rejection.
message CommandRejected {

    // The ID of the command.
    core.CommandId id = 1;

    // The command rejection event.
    core.Event rejection_event = 2 [(validate) = true];
}

// An event emitted when another command was generated in response to a received command.
message CommandTransformed {

    // The ID of the command.
    core.CommandId id = 1;

    // The ID of the command generated in response to the received command.
    core.CommandId produced = 2 [(required) = true];
}

// An event emitted when two or more commands were generated in response to a received command.
message CommandSplit {

    // The ID of the command.
    core.CommandId id = 1;

    // Identifiers of the commands generated in response to the received command.
    repeated core.CommandId produced = 2 [(required) = true];
}
