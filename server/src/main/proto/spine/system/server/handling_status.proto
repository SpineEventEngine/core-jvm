syntax = "proto3";

package spine.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (internal_all) = true;

option java_package = "io.spine.system.server";
option java_outer_classname = "HandlingStatusProto";
option java_multiple_files = true;

import "google/protobuf/empty.proto";

import "spine/base/error.proto";
import "spine/core/event.proto";

// The status of a command after it was handled.
//
// The field numbers match those of `spine.core.Status`, so the stored records of
// `CommandTimeline.how_handled`, which used to be a `spine.core.Status`, stay readable.
//
message HandlingStatus {

    oneof status {
        option (choice).required = true;

        // The command was handled.
        google.protobuf.Empty ok = 1;

        // An error occurred.
        //
        // Either the `CommandBus` did not accept the command, for example, because it is
        // invalid, or the command was accepted, and its handler failed.
        //
        spine.base.Error error = 2;

        // A handler rejected the command.
        spine.core.Event rejection = 3;
    }
}
