syntax = "proto3";

package spine.server.catchup;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (internal_all) = true;
option (every_is).java_type = "io.spine.server.delivery.CatchUpSignal";

option java_package = "io.spine.server.delivery.event";
option java_outer_classname = "CatchUpFinalizationEventsProto";
option java_multiple_files = true;

import "spine/server/catchup/catch_up.proto";

// The catch-up has moved to the `FINALIZING` status.
//
// The catch-up emits this event for itself. By the time it gets the event back,
// the new status is stored, so the `Delivery` holds back the live events of the targets
// before the catch-up reads the rest of the history.
//
message FinalizationStarted {

    CatchUpId id = 1;
}

// The `Delivery` has processed every shard affected by the catch-up, while it saw
// the catch-up `FINALIZING`.
//
// The catch-up emits this event for itself, after it has moved to the `COMPLETED` status.
// By the time it gets the event back, the new status is stored. So a catch-up of the same
// instances may start as soon as this catch-up reports its completion.
//
message AllShardsFinalized {

    CatchUpId id = 1;
}
