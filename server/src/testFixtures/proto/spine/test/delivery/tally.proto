syntax = "proto3";

package spine.test.delivery;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.test.delivery";
option java_outer_classname = "TallyProto";
option java_multiple_files = true;

// The tallies of the catch-up tests that run in up to three Bounded Contexts at once.
//
// Each context serves two projection types of its own, `A` and `B`, because a state type
// is served by one context only. The number in the name tells the context.
//
// Each tally keeps the values of the `NumberAdded` events it applied, in the order applied.

message TallyA1 {
    option (entity).kind = PROJECTION;

    string id = 1;

    repeated int32 value = 2;
}

message TallyB1 {
    option (entity).kind = PROJECTION;

    string id = 1;

    repeated int32 value = 2;
}

message TallyA2 {
    option (entity).kind = PROJECTION;

    string id = 1;

    repeated int32 value = 2;
}

message TallyB2 {
    option (entity).kind = PROJECTION;

    string id = 1;

    repeated int32 value = 2;
}

message TallyA3 {
    option (entity).kind = PROJECTION;

    string id = 1;

    repeated int32 value = 2;
}

message TallyB3 {
    option (entity).kind = PROJECTION;

    string id = 1;

    repeated int32 value = 2;
}
