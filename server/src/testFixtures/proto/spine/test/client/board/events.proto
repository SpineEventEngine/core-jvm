syntax = "proto3";

package spine.test.client.board;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.test.client.board.event";
option java_outer_classname = "EventsProto";
option java_multiple_files = true;

import "spine/test/client/board/card.proto";

// A new open card is put on the board.
message CardCreated {
    CardId id = 1;
    string title = 2;
}

// The card is given to the person who works on it.
message CardAssigned {
    CardId id = 1;
    string assignee = 2;
}

// The work on the card is done.
message CardCompleted {
    CardId id = 1;
}

// The done card is open again.
message CardReopened {
    CardId id = 1;
}
