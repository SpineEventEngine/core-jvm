syntax = "proto3";

package spine.test.client.board;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.test.client.board";
option java_outer_classname = "CardProto";
option java_multiple_files = true;

// The identifier of a card.
message CardId {
    string uuid = 1;
}

// A card on a board, with the columns that client subscriptions filter by.
message Card {
    option (entity) = { kind: AGGREGATE visibility: SUBSCRIBE };

    CardId id = 1;

    string title = 2;

    // The status of the work on the card.
    CardStatus status = 3 [(column) = true];

    // The name of the person who works on the card, if anyone.
    string assignee = 4 [(column) = true];
}

// The status of the work on a card.
enum CardStatus {
    CARD_STATUS_UNDEFINED = 0;
    OPEN = 1;
    DONE = 2;
}
