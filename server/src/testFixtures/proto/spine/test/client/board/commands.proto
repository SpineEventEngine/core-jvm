syntax = "proto3";

package spine.test.client.board;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.test.client.board.command";
option java_outer_classname = "CommandsProto";
option java_multiple_files = true;

import "spine/test/client/board/card.proto";

// Puts a new open card on the board.
message CreateCard {
    CardId id = 1;
    string title = 2;
}

// Gives the card to the person who works on it.
message AssignCard {
    CardId id = 1;
    string assignee = 2;
}

// Marks the work on the card as done.
message CompleteCard {
    CardId id = 1;
}

// Opens the done card again.
message ReopenCard {
    CardId id = 1;
}
