syntax = "proto3";

package spine.test.aggregate;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.test.aggregate.task";
option java_multiple_files = true;

import "spine/core/user_id.proto";

message AggTaskId {
    string id = 1;
}

message AggTask {
    option (entity).kind = AGGREGATE;
    option (entity).visibility = FULL;

    // The ID of the aggregate.
    //
    // In order to avoid the verbose test set up process, the ID may be not set.
    //
    AggTaskId id = 1 [(required) = false];
    
    spine.core.UserId assignee = 2;
}
