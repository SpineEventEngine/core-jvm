syntax = "proto3";

package spine.test.aggregate.event;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.test.aggregate.event";
option java_outer_classname = "AggregateEventsProto";
option java_multiple_files = true;

import "spine/core/user_id.proto";

import "spine/test/aggregate/project.proto";
import "spine/test/aggregate/task.proto";

message AggProjectCreated {
    ProjectId project_id = 1;
    string name = 2;
    repeated ProjectId child_project_id = 3;
}

message AggTaskAdded {
    ProjectId project_id = 1;
    Task task = 2;
}

message AggProjectStarted {
    ProjectId project_id = 1;
}

message AggProjectArchived {
    ProjectId project_id = 1;
    repeated ProjectId child_project_id = 2;
}

message AggProjectDeleted {
    ProjectId project_id = 1;
    repeated ProjectId child_project_id = 2;
}

message AggProjectPaused {
    ProjectId project_id = 1;
}

message AggProjectCancelled {
    ProjectId project_id = 1;
}

message AggTaskCreated {
    AggTaskId task_id = 1;
}

message AggTaskAssigned {
    AggTaskId task_id = 1;
    spine.core.UserId previousAssignee = 2;
    spine.core.UserId newAssignee = 3;
}

message AggTaskStarted {
    AggTaskId task_id = 1;
    ProjectId project_id = 2;
}

message AggUserNotified {
    AggTaskId task_id = 1;
    spine.core.UserId user_id = 2;
}

message AggOwnerNotified {
    spine.core.UserId owner = 1;
}
