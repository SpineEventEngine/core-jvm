syntax = "proto3";

package spine.test.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.system.server";
option java_outer_classname = "EntityHstoryTestProto";
option java_multiple_files = true;

import "spine/people/person_name.proto";

message PersonId {

    string uuid = 1;
}

// A state type of an aggregate.
//
message Person {
    option (entity) = {kind: AGGREGATE visibility: FULL};

    PersonId id = 1 [(required) = false];

    spine.people.PersonName name = 2;
}

// A state type of a process manager.
//
message PersonCreation {
    option (entity) = {kind: PROCESS_MANAGER visibility: FULL};

    PersonId id = 1 [(required) = false];

    bool created = 2;
}

// A state type of an aggregate.
//
message PersonFirstName {
    option (entity) = {kind: AGGREGATE visibility: FULL};

    PersonId id = 1 [(required) = false];

    string first_name = 2;
}

// A state type of a projection.
//
message PersonDetails {
    option (entity).kind = PROJECTION;

    PersonId id = 1 [(required) = false];

    spine.people.PersonName name = 2;
}
