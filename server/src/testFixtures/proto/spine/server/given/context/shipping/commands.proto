syntax = "proto3";

package spine.server.given.context.shipping;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.server.given.context.shipping.command";
option java_outer_classname = "ShippingCommandsProto";
option java_multiple_files = true;

import "spine/server/given/context/shipping/order_id.proto";

// Asks the shipping process of an order to get the order shipped.
message ShipOrder {
    OrderId order = 1 [(required) = true];
}

// Asks a carrier to reserve a shipment for an order.
message ReserveShipment {
    OrderId order = 1 [(required) = true];
}

// Asks to choose a carrier for an order and to reserve a shipment with it.
message PlanShipment {
    OrderId order = 1 [(required) = true];
}
