syntax = "proto3";

package spine.server.given.context.shipping;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.server.given.context.shipping.event";
option java_outer_classname = "ShippingEventsProto";
option java_multiple_files = true;

import "spine/server/given/context/shipping/order_id.proto";

// An order was paid, so it can be shipped.
message OrderPaid {
    OrderId order = 1 [(required) = true];
}

// A carrier reserved a shipment for an order.
message ShipmentReserved {
    OrderId order = 1 [(required) = true];
}

// The reserved shipment of an order was verified with the carrier.
message ShipmentVerified {
    OrderId order = 1 [(required) = true];
}
